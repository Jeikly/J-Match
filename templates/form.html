{% extends 'base.html' %}{% block content %}<a class="back" href="{{url_for('index')}}">← Volver al catálogo</a><div class="top"><div><p class="eyebrow">GESTIÓN DE PRODUCTOS</p><h1>{{title}}</h1><p class="muted">Solo registra funciones que hayas verificado en el reloj.</p></div></div><form class="panel form" method="post"><div class="fields"><label>Nombre *<input name="nombre" required maxlength="120" value="{{request.form.get('nombre',item.nombre if item else '')}}" placeholder="Smartwatch Mini 41 mm"></label><label>Modelo *<input name="modelo" required maxlength="120" value="{{request.form.get('modelo',item.modelo if item else '')}}" placeholder="Referencia del fabricante"></label><label>Categoría *<select name="id_categoria" required><option value="">Selecciona una categoría</option>{% for c in categories %}<option value="{{c.id_categoria}}" {% if request.form.get('id_categoria', (item.id_categoria|string) if item else '') == (c.id_categoria|string) %}selected{% endif %}>{{c.nombre}}</option>{% endfor %}</select></label><label>Precio en COP *<input name="precio" type="number" min="0" step="1" required value="{{request.form.get('precio',item.precio if item else '')}}" placeholder="150000"></label><label>Tamaño (mm)<input name="tamano_mm" type="number" min="1" step="1" value="{{request.form.get('tamano_mm',item.tamano_mm if item and item.tamano_mm else '')}}" placeholder="41"></label><label>Tipo de pantalla<input name="tipo_pantalla" maxlength="80" value="{{request.form.get('tipo_pantalla',item.tipo_pantalla if item else '')}}" placeholder="AMOLED / LCD / Otro"></label><label>Compatibilidad<input name="compatibilidad" maxlength="100" value="{{request.form.get('compatibilidad',item.compatibilidad if item else '')}}" placeholder="Android / iOS"></label><label class="wide">Descripción<textarea name="descripcion" rows="3" placeholder="Descripción breve">{{request.form.get('descripcion',item.descripcion if item else '')}}</textarea></label></div><h2>Funciones comprobadas</h2><div class="checks">{% for f in features %}<label class="check"><input type="checkbox" name="caracteristicas" value="{{f.id_caracteristica}}" {% if (f.id_caracteristica in selected and not request.form) or (f.id_caracteristica|string in request.form.getlist('caracteristicas')) %}checked{% endif %}>{{f.nombre}}</label>{% endfor %}</div><div class="form-actions"><button class="btn" type="submit">Guardar smartwatch</button><a class="btn secondary" href="{{url_for('index')}}">Cancelar</a></div></form>{% endblock %}
